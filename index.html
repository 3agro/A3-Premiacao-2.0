<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#1e9b4b" />
  <meta name="description" content="A3 Premiação - desempenho, metas e reconhecimento da equipe de produção" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/styles.css" />
  <title>A3 Premiação</title>
</head>
<body>
  <div id="toast" class="toast"></div>
  <section id="loginView" class="login-shell">
    <div class="login-card">
      <img class="login-logo" src="/a3-logo.png" alt="A3 Sementes" />
      <div class="program-badge">PROGRAMA DE RECONHECIMENTO</div>
      <h1>A3 Premiação</h1>
      <p>Desempenho • Desenvolvimento • Reconhecimento</p>
      <form id="loginForm" class="stack">
        <label>Usuário<input id="loginUser" autocomplete="username" required /></label>
        <label>Senha<input id="loginPass" type="password" autocomplete="current-password" required /></label>
        <button class="btn primary" type="submit">Entrar</button>
      </form>
      <p class="helper">Acesso individual para gestores e colaboradores.</p>
    </div>
  </section>

  <div id="appView" class="app hidden">
    <header class="topbar">
      <div class="brand-top"><img src="/a3-logo.png" alt="A3 Sementes"><div><strong>A3 Premiação</strong><small id="whoami"></small></div></div>
      <div class="top-actions">
        <button id="installBtn" class="btn ghost small hidden">Instalar</button>
        <button id="logoutBtn" class="btn ghost small">Sair</button>
      </div>
    </header>
    <main id="main"></main>
    <nav id="bottomNav" class="bottom-nav"></nav>
  </div>

  <dialog id="modal" class="modal"><div id="modalContent"></div></dialog>
  <script src="/app.js" defer></script>
</body>
</html>
